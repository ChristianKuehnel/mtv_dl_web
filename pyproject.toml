[project]
name = "mtv_dl_web"
version = "0.1.0"
description = "Web Interface for MTV Downloader"
authors = [
    { name = "MTV Downloader Team" },
]
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.31.1,<0.32.0",
    "apscheduler>=3.10.4,<4.0.0",
    "python-multipart>=0.0.17,<0.1.0",
    "pydantic>=2.9.2,<3.0.0",
    "anyio>=3.7.0,<4.0.0",
    "mtv-dl",
    "types-PyYAML>=6.0.12.20240918",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9.0",
    "mypy>=1.16.0,<2.0.0",
    "black>=24.4.2,<27.0",
    "pre-commit>=3.5.0,<5.0",
    "pytest-cov>=4.1.0,<8.0",
    "pytest-asyncio>=0.23.0,<2.0",
    "httpx>=0.28.1,<0.29.0",
    "types-requests>=2.32.0.20240914",
]

[build-system]
requires = ["uv-build<0.12"]
build-backend = "uv_build"

[tool.mypy]
strict = true
warn_unused_ignores = true

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.pytest.ini_options]
addopts = [
    "--doctest-modules",
    "--import-mode=importlib"
]

xfail_strict = true
filterwarnings = [
    "ignore:Please use `import python_multipart` instead\\.:PendingDeprecationWarning",
]
