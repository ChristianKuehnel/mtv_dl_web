[project]
name = "mtv_dl_web"
version = "0.1.0"
description = "Web Interface for MTV Downloader"
authors = [
    { name = "MTV Downloader Team" },
]
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.1",
    "python-multipart>=0.0.17",
    "pydantic>=2.9.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9.1",
    "mypy>=1.16.0",
    "black>=24.4.2",
    "pre-commit>=3.5.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.28.1",
    "types-requests>=2.32.0.20240914",
]

[build-system]
requires = ["uv-build"]
build-backend = "uv_build"

[tool.uv]
dev-dependencies = ["dev"]

[tool.mypy]
strict = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.ruff]
line-length = 120
lint.select = [
    "A",
    "ARG",
    "E",
    "F",
    "I",
    "N",
    "PTH",
    "Q",
    "RUF",
    "SIM",
    "UP",
    "W",
]
lint.isort.force-single-line = true

[tool.pytest.ini_options]
addopts = "--doctest-modules --mypy --ruff --ruff-format"
xfail_strict = true