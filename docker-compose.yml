version: "3.8"

services:
  mtv_dl_web:
    build: .
    container_name: mtv_dl_web
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./downloads:/downloads
      - ./config:/config
    environment:
      - PYTHONPATH=/app/src
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_PATH=/data/filmliste.sqlite
      - DOWNLOAD_QUALITY=best
      - TARGET_DIRECTORY=/downloads
      - ENABLE_SUBTITLES=true
      - ENABLE_NFO=true
      - ENABLE_MKV_MERGE=false
    restart: unless-stopped
