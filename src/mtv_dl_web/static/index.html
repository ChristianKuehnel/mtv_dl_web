<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MTV Downloader</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f6f7f9;
        color: #20242c;
      }

      main {
        width: min(90vw, 42rem);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 8vw, 4rem);
        line-height: 1;
      }

      p {
        margin: 0;
        font-size: 1.125rem;
        color: #5d6675;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #11141a;
          color: #f5f7fb;
        }

        p {
          color: #bac2d0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MTV Downloader</h1>
      <p>The web application is running.</p>
    </main>
  </body>
</html>
