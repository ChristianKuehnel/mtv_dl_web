<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MTV Downloader Web Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="bg-gray-100 min-h-screen">
    <div id="app" class="container mx-auto px-4 py-8">
      <!-- Header -->
      <header class="mb-8 text-center">
        <div class="flex flex-col items-center gap-3">
          <h1 class="text-3xl font-bold text-gray-800">MTV Downloader</h1>
          <div
            id="health-indicator"
            class="inline-flex items-center gap-2 rounded-full border border-gray-200 bg-white px-3 py-1 text-sm font-medium text-gray-700 shadow-sm"
          >
            <span
              id="health-dot"
              class="h-2.5 w-2.5 rounded-full bg-red-500"
              aria-hidden="true"
            ></span>
            <span id="health-label">offline</span>
          </div>
        </div>
        <p class="text-gray-600">
          Download videos from German public broadcasting services
        </p>
      </header>

      <!-- Status Bar -->
      <div
        id="status-bar"
        class="mb-6 bg-blue-50 border border-blue-200 rounded-lg p-4 hidden"
      >
        <div class="flex items-center">
          <i class="fas fa-info-circle text-blue-500 mr-2"></i>
          <span id="status-message"></span>
        </div>
      </div>

      <!-- Search Section -->
      <div class="bg-white rounded-lg shadow-md p-6 mb-6">
        <h2 class="text-xl font-semibold mb-4 text-gray-800">Search Shows</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Filters (space separated)</label
            >
            <input
              type="text"
              id="search-filters"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="channel=ARD topic='extra 3' duration+20m"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Target Directory</label
            >
            <input
              type="text"
              id="target-dir"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
              value="./downloads"
            />
          </div>
        </div>
        <button
          id="search-btn"
          class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md transition duration-200 flex items-center"
        >
          <i class="fas fa-search mr-2"></i> Search Shows
        </button>
      </div>

      <!-- Results Section -->
      <div id="results-section" class="hidden">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-semibold text-gray-800">Search Results</h2>
          <div class="flex space-x-2">
            <button
              id="select-all-btn"
              class="text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 py-1 px-3 rounded"
            >
              Select All
            </button>
            <button
              id="deselect-all-btn"
              class="text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 py-1 px-3 rounded"
            >
              Deselect All
            </button>
          </div>
        </div>

        <div
          id="results-container"
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6"
        >
          <!-- Results will be populated here -->
        </div>

        <div class="bg-white rounded-lg shadow-md p-6">
          <h3 class="text-lg font-medium mb-3 text-gray-800">
            Download Options
          </h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Quality</label
              >
              <select
                id="quality-select"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
              >
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Include Subtitles</label
              >
              <div class="flex items-center">
                <input
                  type="checkbox"
                  id="subtitles-checkbox"
                  class="mr-2"
                  checked
                />
                <label for="subtitles-checkbox">Include subtitles</label>
              </div>
            </div>
          </div>

          <button
            id="download-btn"
            class="bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded-md transition duration-200 flex items-center disabled:opacity-50"
          >
            <i class="fas fa-download mr-2"></i> Download Selected Shows
          </button>
        </div>
      </div>

      <!-- Downloads Section -->
      <div id="downloads-section" class="mt-8">
        <h2 class="text-xl font-semibold mb-4 text-gray-800">
          Active Downloads
        </h2>
        <div id="downloads-container" class="bg-white rounded-lg shadow-md p-6">
          <div id="no-downloads" class="text-center py-8 text-gray-500">
            <i class="fas fa-cloud-download-alt text-4xl mb-2"></i>
            <p>No active downloads</p>
          </div>
          <div id="downloads-list" class="hidden">
            <!-- Active downloads will be populated here -->
          </div>
        </div>
      </div>
    </div>

    <script>
      // Global variables
      const API_BASE = "/api";
      let selectedShows = new Set();
      let activeDownloads = new Map();

      // DOM Elements
      const searchBar = document.getElementById("search-filters");
      const searchBtn = document.getElementById("search-btn");
      const resultsSection = document.getElementById("results-section");
      const resultsContainer = document.getElementById("results-container");
      const selectAllBtn = document.getElementById("select-all-btn");
      const deselectAllBtn = document.getElementById("deselect-all-btn");
      const downloadBtn = document.getElementById("download-btn");
      const qualitySelect = document.getElementById("quality-select");
      const subtitlesCheckbox = document.getElementById("subtitles-checkbox");
      const targetDir = document.getElementById("target-dir");
      const downloadsSection = document.getElementById("downloads-section");
      const downloadsContainer = document.getElementById("downloads-container");
      const downloadsList = document.getElementById("downloads-list");
      const noDownloads = document.getElementById("no-downloads");
      const statusBar = document.getElementById("status-bar");
      const statusMessage = document.getElementById("status-message");
      const healthIndicator = document.getElementById("health-indicator");
      const healthDot = document.getElementById("health-dot");
      const healthLabel = document.getElementById("health-label");

      const HEALTH_STATES = {
        online: {
          label: "online",
          indicatorClass:
            "inline-flex items-center gap-2 rounded-full border border-green-200 bg-green-50 px-3 py-1 text-sm font-medium text-green-800 shadow-sm",
          dotClass: "h-2.5 w-2.5 rounded-full bg-green-500",
        },
        updating: {
          label: "updating",
          indicatorClass:
            "inline-flex items-center gap-2 rounded-full border border-yellow-200 bg-yellow-50 px-3 py-1 text-sm font-medium text-yellow-800 shadow-sm",
          dotClass: "h-2.5 w-2.5 rounded-full bg-yellow-500",
        },
        offline: {
          label: "offline",
          indicatorClass:
            "inline-flex items-center gap-2 rounded-full border border-red-200 bg-red-50 px-3 py-1 text-sm font-medium text-red-800 shadow-sm",
          dotClass: "h-2.5 w-2.5 rounded-full bg-red-500",
        },
      };

      function updateHealthStatus(state) {
        const healthState = HEALTH_STATES[state] || HEALTH_STATES.offline;

        healthIndicator.className = healthState.indicatorClass;
        healthDot.className = healthState.dotClass;
        healthLabel.textContent = healthState.label;
      }

      async function refreshHealthStatus() {
        try {
          const response = await fetch("/health", { cache: "no-store" });

          if (!response.ok) {
            throw new Error("Health check failed");
          }

          const data = await response.json();
          if (data.status === "updating") {
            updateHealthStatus("updating");
            return;
          }

          updateHealthStatus(data.status === "healthy" ? "online" : "offline");
        } catch (error) {
          updateHealthStatus("offline");
        }
      }

      // Show status message
      function showStatus(message, type = "info") {
        statusMessage.textContent = message;
        statusBar.className =
          "mb-6 bg-" +
          (type === "error" ? "red" : "blue") +
          "-50 border border-" +
          (type === "error" ? "red" : "blue") +
          "-200 rounded-lg p-4";
        statusBar.classList.remove("hidden");

        // Auto-hide after 5 seconds
        setTimeout(() => {
          statusBar.classList.add("hidden");
        }, 5000);
      }

      // Split mtv_dl-style filters while preserving quoted values.
      function parseFilters(input) {
        const filters = [];
        let current = "";
        let quote = null;
        let escaped = false;

        for (const char of input.trim()) {
          if (escaped) {
            current += char;
            escaped = false;
            continue;
          }

          if (char === "\\") {
            current += char;
            escaped = true;
            continue;
          }

          if ((char === "'" || char === '"') && quote === null) {
            quote = char;
            current += char;
            continue;
          }

          if (char === quote) {
            quote = null;
            current += char;
            continue;
          }

          if (/\s/.test(char) && quote === null) {
            if (current.length > 0) {
              filters.push(current);
              current = "";
            }
            continue;
          }

          current += char;
        }

        if (quote !== null) {
          throw new Error("Unclosed quoted filter value");
        }

        if (current.length > 0) {
          filters.push(current);
        }

        return filters;
      }

      // Search for shows
      async function searchShows() {
        const filterText = searchBar.value.trim();
        if (!filterText) {
          showStatus("Please enter search filters", "error");
          return;
        }

        try {
          const filters = parseFilters(filterText);
          showStatus("Searching shows...");
          const response = await fetch(`${API_BASE}/search`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              filters,
            }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.detail || "Search failed");
          }

          displayResults(data.results);
          showStatus(`Found ${data.results.length} shows`);
        } catch (error) {
          showStatus(`Search error: ${error.message}`, "error");
          console.error("Search error:", error);
        }
      }

      // Display search results
      function displayResults(results) {
        resultsContainer.innerHTML = "";

        if (results.length === 0) {
          resultsContainer.innerHTML =
            '<div class="col-span-full text-center py-8 text-gray-500">No shows found</div>';
          resultsSection.classList.add("hidden");
          return;
        }

        resultsSection.classList.remove("hidden");
        selectedShows.clear();

        results.forEach((show) => {
          const showDiv = document.createElement("div");
          showDiv.className =
            "border border-gray-200 rounded-lg p-4 hover:shadow-md transition-shadow";
          showDiv.innerHTML = `
                    <div class="flex items-start">
                        <input type="checkbox" id="show-${show.hash}" class="mt-1 mr-3" value="${show.hash}">
                        <div class="flex-1">
                            <h3 class="font-semibold text-gray-800">${show.title}</h3>
                            <p class="text-sm text-gray-600">${show.channel} - ${show.topic}</p>
                            <div class="text-xs text-gray-500 mt-1">
                                <span>${show.duration}</span> | 
                                <span>${show.size} MB</span> | 
                                <span>${new Date(show.start).toLocaleDateString()}</span>
                            </div>
                        </div>
                    </div>
                `;
          resultsContainer.appendChild(showDiv);

          // Add event listener to checkbox
          const checkbox = showDiv.querySelector('input[type="checkbox"]');
          checkbox.addEventListener("change", (e) => {
            if (e.target.checked) {
              selectedShows.add(show.hash);
            } else {
              selectedShows.delete(show.hash);
            }
            updateDownloadButton();
          });
        });
        updateDownloadButton();
      }

      // Update download button state
      function updateDownloadButton() {
        downloadBtn.disabled = selectedShows.size === 0;
      }

      // Download selected shows
      async function downloadSelected() {
        if (selectedShows.size === 0) {
          showStatus("Please select at least one show to download", "error");
          return;
        }

        let filters;
        try {
          filters = parseFilters(searchBar.value);
        } catch (error) {
          showStatus(`Filter error: ${error.message}`, "error");
          return;
        }

        const targetDirectory = targetDir.value || "./downloads";
        const quality = qualitySelect.value;
        const includeSubtitles = subtitlesCheckbox.checked;

        try {
          showStatus("Starting downloads...");
          const response = await fetch(`${API_BASE}/download`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              filters: filters,
              quality: quality,
              target_directory: targetDirectory,
              include_subtitles: includeSubtitles,
              include_nfo: true,
              merge_to_mkv: false,
            }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.detail || "Download start failed");
          }

          showStatus(`Started downloading ${selectedShows.size} shows`);
          selectedShows.clear();
          updateDownloadButton();
          // Refresh downloads list
          refreshDownloads();
        } catch (error) {
          showStatus(`Download error: ${error.message}`, "error");
          console.error("Download error:", error);
        }
      }

      // Refresh downloads list
      async function refreshDownloads() {
        try {
          const response = await fetch(`${API_BASE}/download/status`);
          const data = await response.json();

          if (!response.ok) {
            throw new Error("Failed to fetch download status");
          }

          // Update active downloads
          activeDownloads = new Map(Object.entries(data));

          if (activeDownloads.size === 0) {
            noDownloads.classList.remove("hidden");
            downloadsList.classList.add("hidden");
          } else {
            noDownloads.classList.add("hidden");
            downloadsList.classList.remove("hidden");
            displayActiveDownloads();
          }
        } catch (error) {
          console.error("Error refreshing downloads:", error);
        }
      }

      // Display active downloads
      function displayActiveDownloads() {
        downloadsList.innerHTML = "";

        activeDownloads.forEach((status, id) => {
          const downloadDiv = document.createElement("div");
          downloadDiv.className = "border border-gray-200 rounded-lg p-4 mb-2";
          downloadDiv.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-medium text-gray-800 truncate max-w-md">${id.substring(0, 10)}...</h4>
                            <div class="text-sm text-gray-600">
                                <span class="inline-block w-20">Status:</span>
                                <span class="font-medium ${
                                  status.status === "completed"
                                    ? "text-green-600"
                                    : status.status === "failed"
                                      ? "text-red-600"
                                      : "text-yellow-600"
                                }">${status.status.toUpperCase()}</span>
                            </div>
                            <div class="text-sm text-gray-600">
                                <span class="inline-block w-20">Progress:</span>
                                <span>${Math.round(status.progress * 100)}%</span>
                            </div>
                            <div class="text-sm text-gray-600">
                                <span class="inline-block w-20">Message:</span>
                                <span>${status.message}</span>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="text-xs text-gray-500 mb-1">
                                ${status.file_path ? "Downloaded" : "In Progress"}
                            </div>
                            <div class="text-xs text-gray-500">
                                ${status.file_path ? `<i class="fas fa-check-circle text-green-500"></i>` : ""}
                            </div>
                        </div>
                    </div>
                `;
          downloadsList.appendChild(downloadDiv);
        });
      }

      // Event Listeners
      searchBtn.addEventListener("click", searchShows);
      downloadBtn.addEventListener("click", downloadSelected);
      selectAllBtn.addEventListener("click", () => {
        const checkboxes = document.querySelectorAll(
          '#results-container input[type="checkbox"]',
        );
        checkboxes.forEach((cb) => {
          cb.checked = true;
          selectedShows.add(cb.value);
        });
        updateDownloadButton();
      });
      deselectAllBtn.addEventListener("click", () => {
        const checkboxes = document.querySelectorAll(
          '#results-container input[type="checkbox"]',
        );
        checkboxes.forEach((cb) => {
          cb.checked = false;
          selectedShows.delete(cb.value);
        });
        updateDownloadButton();
      });

      // Initialize
      document.addEventListener("DOMContentLoaded", () => {
        refreshHealthStatus();
        setInterval(refreshHealthStatus, 5000);
        // Periodically refresh downloads
        setInterval(refreshDownloads, 5000);
      });
    </script>
  </body>
</html>
